services:
  - type: web
    name: crm-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: '*'
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        value: crm-271@pappyjoe-crm.iam.gserviceaccount.com
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/credentials.json
